<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comparador de Farmacias Chile - Vista Matriz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <!-- Header -->
    <header class="hero">
      <div class="logo-badge">💊 COMPARADOR DE FARMACIAS CHILE</div>
      <h1>🏥 Compara Precios de tu Receta</h1>
      <p class="hero-instructions">Ingresa los medicamentos separados por coma</p>
    </header>

    <!-- Buscador -->
    <div class="search-tips">
      <span class="tips-title"><strong>Tips:</strong></span>
      <span class="tip-line">• Escribe el <strong>principio activo</strong> si buscas mejores precios 💰</span>
      <span class="tip-line">• La <strong>marca</strong> si buscas un medicamento específico 🧴</span>
    </div>
    <form id="search-form" class="search-box">
      <div class="input-wrap">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Ej: omeprazol, amoxicilina, paracetamol, eutirox 100mcg"
          autocomplete="off"
          autofocus
          required 
        />
      </div>
      <button type="submit" id="search-btn" class="btn-primary">Buscar Precios</button>
    </form>

    <!-- Status / Animación de Carga -->
    <div id="status-bar" class="status-bar">
      <div class="spinner" id="spinner"></div>
      <div class="status-text-wrap">
        <div class="status-header-row">
          <span id="status-title" class="status-title">Buscando...</span>
          <span id="status-step" class="status-step"></span>
        </div>
        <div class="progress-bar-container">
          <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
      </div>
    </div>

    <!-- Resultados -->
    <section id="results-wrapper" class="results-wrapper">
      <div id="comparison-summary" class="comparison-summary"></div>
      <div id="pharmacy-grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
